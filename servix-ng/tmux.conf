# Enable 256 colors and 24 bits
set -g default-terminal "tmux-256color"
set -as terminal-features ",rxvt*:RGB"

# Enable mouse support to select pane and scroll
set-window-option -g mouse on

# Keep a slightly larger backlog
set -g history-limit 30000


# Improve status bar
set -g status on
set -g status-interval 10
set -g status-justify left
set -g status-left-length 24

%if #{special_production_user}
# -- Production Environment
set -g status-left-style fg=black,bright,bg=orange
set -g status-style fg=white,bright,bg=red
setw -g window-status-current-style fg=white,bg=black,bright

%else
# -- Regular Environment
set -g status-style fg=white,bg=black
setw -g window-status-current-style fg=white,bg=red,bright

%endif
